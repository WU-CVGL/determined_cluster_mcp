# The policy for one deployment. Copy this file outside version control and replace every
# placeholder; old image and pool examples are not defaults.
#
# mounts maps each container path to the host path that the administrator binds on every agent
# (task_container_defaults.bind_mounts). The MCP never sends a bind mount; it uses this map to
# check paths and to reach shared storage through storage access.
mounts:
  - host_path: "/workspace/REPLACE_WITH_USER"
    container_path: "/run/determined/workdir/home"

  # Keep the shared roots available on your cluster agents.
  - host_path: "/SSD"
    container_path: "/SSD"
  - host_path: "/SSD_home"
    container_path: "/SSD_home"
  - host_path: "/SSD_datasets"
    container_path: "/SSD_datasets"
    # read_only: true  # Enable for reference datasets.
  - host_path: "/SSD3"
    container_path: "/SSD3"
  - host_path: "/SSD3_home"
    container_path: "/SSD3_home"
  - host_path: "/SSD3_datasets"
    container_path: "/SSD3_datasets"
  - host_path: "/UNSAFE_SSD4"
    container_path: "/UNSAFE_SSD4"

# Pool and slots are always sent explicitly, from these defaults unless a request sets them.
defaults:
  image: "REPLACE_WITH_VERIFIED_IMAGE"
  pool: "REPLACE_WITH_VERIFIED_POOL"
  slots: 1

# Pools a request may name; only the default pool when omitted.
# pools: ["REPLACE_WITH_VERIFIED_POOL"]

# The most slots one request may hold: slots per trial times concurrent trials.
# max_slots: 8

# Whether storage_sync and storage_fetch may replace existing files.
allow_overwrite: false
